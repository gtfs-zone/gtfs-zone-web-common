name: Check

# On a push to a branch or a pull request: runs the node check, and on a pull
# request the commit check.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    uses: gtfs-zone/.github/.github/workflows/node-check.yml@7215142f2305e7d30e74005fd207aade078563c8 # main

  commits:
    if: github.event_name == 'pull_request'
    uses: gtfs-zone/.github/.github/workflows/commit-check.yml@7215142f2305e7d30e74005fd207aade078563c8 # main
