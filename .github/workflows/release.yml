name: Release

# Run by hand: bumps the version on main with cz bump and pushes the bump
# commit and its tag. The tag is the release; nothing deploys.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    uses: gtfs-zone/.github/.github/workflows/release.yml@cb9bfb961afb84655f78d4bcb7df5e1009b889e4 # main
    permissions:
      contents: write
      actions: write
