version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Max Katz-Christy and gtfs.zone contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Vendored from google/transit (GTFS Schedule reference), maintained by MobilityData
[[annotations]]
path = ["reference/gtfs-reference.md", "src/gtfs/spec/files/**"]
precedence = "override"
SPDX-FileCopyrightText = "Google Inc. and contributors"
SPDX-License-Identifier = "Apache-2.0"

# Snapshot of Google's GTFS reference differences page
[[annotations]]
path = "reference/google-reference.md"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "CC-BY-4.0"

# Google overlay: its descriptions and notes are Google's wording
[[annotations]]
path = "src/gtfs/spec/extensions/google.ts"
precedence = "override"
SPDX-FileCopyrightText = [
  "Max Katz-Christy and gtfs.zone contributors",
  "Google LLC",
]
SPDX-License-Identifier = "AGPL-3.0-or-later AND CC-BY-4.0"

# Fixture feeds: built from MBTA transit data
[[annotations]]
path = "fixtures/feeds/**"
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "Max Katz-Christy and gtfs.zone contributors",
  "Massachusetts Bay Transportation Authority",
]
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Fixture basemap tiles: OpenStreetMap data in the Protomaps schema
[[annotations]]
path = "fixtures/basemap/boston.pmtiles"
precedence = "override"
SPDX-FileCopyrightText = ["OpenStreetMap contributors", "Protomaps LLC"]
SPDX-License-Identifier = "ODbL-1.0"

# Fixture basemap styles: generated by @protomaps/basemaps
[[annotations]]
path = "fixtures/basemap/style-*.json"
precedence = "override"
SPDX-FileCopyrightText = "Protomaps LLC, Kelso Cartography"
SPDX-License-Identifier = "BSD-3-Clause"

# Fixture basemap glyphs: Noto Sans, from protomaps/basemaps-assets
[[annotations]]
path = "fixtures/basemap/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "OFL-1.1"

# Fixture basemap sprites: protomaps/basemaps-assets, derived from tangrams/icons
[[annotations]]
path = "fixtures/basemap/sprites/**"
precedence = "override"
SPDX-FileCopyrightText = ["Protomaps LLC", "Mapzen"]
SPDX-License-Identifier = "MIT"
